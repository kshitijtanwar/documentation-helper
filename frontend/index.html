<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain Documentation Helper</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message ai-message">
                 <img src="https://raw.githubusercontent.com/Kshitij-2003/Langchain-Documentation-Helper/main/frontend/images/ai_avatar.png" alt="AI Avatar" class="avatar">
                <div class="text-content">
                    <p>Hello! How can I help you with LangChain today?</p>
                </div>
            </div>
        </div>
        <div class="input-container">
            <textarea id="user-input" placeholder="Ask a question about LangChain..."></textarea>
            <button id="send-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94L21.5 12 3.478 2.405Z"></path></svg>
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
